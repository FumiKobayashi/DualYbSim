name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Interpreter comes from .python-version; --locked fails if uv.lock has
      # drifted from pyproject.toml instead of silently re-resolving.
      - run: uv python install
      - run: uv sync --locked
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: mypy
        run: uv run --no-sync mypy src/dualybsim

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      # Runs every hook, including the ones no other job covers (bandit,
      # whitespace, docstring-first), so .pre-commit-config.yaml cannot
      # silently drift from what the project actually enforces.
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Overrides the .python-version pin for every uv call in this job.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --no-default-groups --group test
      - name: pytest
        run: uv run --no-sync pytest -q --run-slow
      - name: example runs end to end
        run: uv run --no-sync python examples/minimal_repetition_code.py
